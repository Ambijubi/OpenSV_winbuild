name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (MSVC)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build OpenSV
        run: cmake --build build --config Release --target OpenSV --parallel

      - name: Smoke check
        run: |
          $exe = "build\OpenSV_artefacts\Release\OpenSV.exe"
          if (-not (Test-Path $exe)) { throw "OpenSV.exe not found" }
          Get-Item $exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSV-win64
          path: build/OpenSV_artefacts/Release/OpenSV.exe
